<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Asistente IA</title>
<style>
:root{--bg:#14161a;--panel:#1b1e24;--line:#2a2e37;--text:#e6e8ec;--muted:#98a0ae;--accent:#6d83ff}
@media (prefers-color-scheme: light){:root{--bg:#f4f5f7;--panel:#fff;--line:#dcdfe5;--text:#1b1e24;--muted:#667085;--accent:#4f6df5}}
*{box-sizing:border-box}
html,body{margin:0;height:96px;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.3 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;user-select:none}
.row{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel);height:48px}
.row+.row{height:48px}
button,select{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover,select:hover{background:rgba(127,127,160,.14)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.prov{flex:1;display:flex;gap:4px}.prov button{flex:1;font-weight:600}
.prov button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ico{width:30px;padding:5px 0;text-align:center}
.ico.on{background:rgba(109,131,255,.25);border-color:var(--accent)}
select{min-width:0;background:var(--bg)}
.send{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
#msg{flex:1;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div class="row">
  <div class="prov" id="prov">
    <button data-p="chatgpt">ChatGPT</button><button data-p="claude">Claude</button><button data-p="gemini">Gemini</button>
  </div>
  <button class="ico" id="back" title="Atrás">←</button>
  <button class="ico" id="fwd" title="Adelante">→</button>
  <button class="ico" id="reload" title="Recargar">⟳</button>
  <button class="ico" id="ext" title="Abrir en el navegador">↗</button>
  <button class="ico" id="pin" title="Mantener siempre visible">📌</button>
</div>
<div class="row">
  <select id="tpl" title="Plantilla de instrucción">
    <option value="feedback">Feedback del fragmento</option>
    <option value="dialogue">Mejorar diálogos</option>
    <option value="format">Revisar formato y continuidad</option>
    <option value="logline">Logline y sinopsis</option>
    <option value="free">Solo texto (sin instrucción)</option>
  </select>
  <select id="scope" title="Qué enviar">
    <option value="selection">Selección</option>
    <option value="scene">Escena actual</option>
    <option value="script">Guion completo</option>
  </select>
  <button class="send" id="send" title="Pega la instrucción y el texto en el chat">Enviar al chat</button>
  <button id="note" title="Insertar como nota la selección de la respuesta">→ Nota</button>
</div>
<script src="ai.js"></script>
</body>
</html>
